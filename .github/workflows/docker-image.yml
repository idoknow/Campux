name: Docker Image

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      admin_digest: ${{ steps.build_main.outputs.digest || steps.retry_main.outputs.digest }}
      dash_digest: ${{ steps.build_dash.outputs.digest || steps.retry_dash.outputs.digest }}
      landing_digest: ${{ steps.build_landing.outputs.digest || steps.retry_landing.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Docker tag
        id: meta
        shell: bash
        run: |
          raw_tag="${GITHUB_REF_NAME}"
          tag="$(printf '%s' "$raw_tag" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-128)"
          if [ -z "$tag" ]; then
            tag="${GITHUB_SHA::12}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=rockchin/campux:$tag" >> "$GITHUB_OUTPUT"
          echo "dash_image=rockchin/campux-dash:$tag" >> "$GITHUB_OUTPUT"
          echo "landing_image=rockchin/campux-landing:$tag" >> "$GITHUB_OUTPUT"
          echo "build_version=$tag-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # GitHub Actions runner 到 registry-1.docker.io 偶发超时，
          # 配置国内镜像加速 + daemon 级重试。
          driver-opts: |
            image=moby/buildkit:latest
            network=host
          buildkitd-flags: --debug

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push branch image
        uses: docker/build-push-action@v6
        continue-on-error: true
        id: build_main
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            rockchin/campux:sha-${{ github.sha }}
          build-args: |
            CAMPUX_BUILD_VERSION=${{ steps.meta.outputs.build_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retry build on failure
        id: retry_main
        if: steps.build_main.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            rockchin/campux:sha-${{ github.sha }}
          build-args: |
            CAMPUX_BUILD_VERSION=${{ steps.meta.outputs.build_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 重试时禁用 provenance attestation 减少 registry 交互
          provenance: false
          sbom: false

      - name: Build and push telemetry dash image
        uses: docker/build-push-action@v6
        continue-on-error: true
        id: build_dash
        with:
          context: .
          file: apps/dash/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.dash_image }}
            rockchin/campux-dash:sha-${{ github.sha }}
          cache-from: type=gha,scope=dash
          cache-to: type=gha,mode=max,scope=dash

      - name: Retry dash build on failure
        id: retry_dash
        if: steps.build_dash.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dash/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.dash_image }}
            rockchin/campux-dash:sha-${{ github.sha }}
          cache-from: type=gha,scope=dash
          cache-to: type=gha,mode=max,scope=dash
          provenance: false
          sbom: false

      - name: Build and push landing image
        uses: docker/build-push-action@v6
        continue-on-error: true
        id: build_landing
        with:
          context: .
          file: landing/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.landing_image }}
            rockchin/campux-landing:sha-${{ github.sha }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing

      - name: Retry landing build on failure
        id: retry_landing
        if: steps.build_landing.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: landing/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.landing_image }}
            rockchin/campux-landing:sha-${{ github.sha }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing
          provenance: false
          sbom: false

  deploy:
    name: Deploy Production (K3s)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/deploy/prod'
    timeout-minutes: 20
    concurrency:
      group: campux-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release is canonical main
        run: |
          git fetch origin main deploy/prod
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/deploy/prod)" = "$GITHUB_SHA"
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.4
      - name: Deploy exact images and verify production
        env:
          KUBECONFIG_DATA: ${{ secrets.CAMPUX_KUBECONFIG }}
          ADMIN_IMAGE: rockchin/campux@${{ needs.build.outputs.admin_digest }}
          DASH_IMAGE: rockchin/campux-dash@${{ needs.build.outputs.dash_digest }}
          LANDING_IMAGE: rockchin/campux-landing@${{ needs.build.outputs.landing_digest }}
        run: bash scripts/deploy-k3s.sh

  deploy-docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/deploy/prod'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check docs changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="HEAD^"
          fi
          if git diff --quiet "$before" "$GITHUB_SHA" -- docs package.json bun.lock; then
            echo "docs=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.docs == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        if: steps.changes.outputs.docs == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.changes.outputs.docs == 'true'
        run: bun install --frozen-lockfile

      - name: Build docs
        if: steps.changes.outputs.docs == 'true'
        run: bun run docs:build

      - name: Deploy docs to Cloudflare Pages
        if: steps.changes.outputs.docs == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler pages deploy docs/.vitepress/dist \
            --project-name campux \
            --branch main
